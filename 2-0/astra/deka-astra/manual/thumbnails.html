<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>STL preview</title><style>body{margin:0;width:600px;height:360px;background:#eef2f4;color:#263a46;font:18px Arial,sans-serif;letter-spacing:0}canvas{display:block}footer{position:absolute;bottom:0;left:0;right:0;height:42px;background:white;border-top:1px solid #dbe3e7;display:flex;justify-content:space-between;align-items:center;padding:0 16px}small{font-size:14px;color:#637580}</style></head><body><footer><b id="name"></b><small id="size"></small></footer><script src="../viewer/vendor/three.js"></script><script src="../viewer/vendor/STLLoader.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color('#eef2f4');
const camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,4000);camera.up.set(0,0,1);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(600,318);renderer.outputEncoding=THREE.sRGBEncoding;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x72838e,.8));const light=new THREE.DirectionalLight(0xffffff,.8);light.position.set(100,-150,300);scene.add(light);
let current;window.preview=async function(name,title){
if(current){scene.remove(current);current.geometry.dispose();current.material.dispose();}
const g=await new THREE.STLLoader().loadAsync('../stl/'+name+'.stl');g.computeBoundingBox();const b=g.boundingBox,c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3());
const color=name.includes('guide')?'#36a671':name.includes('crank')?'#358aca':name.includes('tail')?'#e6a149':'#a8b9c5';current=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,roughness:.65}));scene.add(current);
camera.position.copy(c).add(new THREE.Vector3(1,-1.2,name.includes('_A3')?.55:1.9).normalize().multiplyScalar(1000));camera.lookAt(c);camera.updateMatrixWorld();
let loX=Infinity,hiX=-Infinity,loY=Infinity,hiY=-Infinity;
for(const x of [b.min.x,b.max.x])for(const y of [b.min.y,b.max.y])for(const z of [b.min.z,b.max.z]){const p=new THREE.Vector3(x,y,z).applyMatrix4(camera.matrixWorldInverse);loX=Math.min(loX,p.x);hiX=Math.max(hiX,p.x);loY=Math.min(loY,p.y);hiY=Math.max(hiY,p.y);}
const half=Math.max((hiY-loY)/2,(hiX-loX)/2/(600/318))*1.2;camera.left=-half*600/318;camera.right=half*600/318;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();
document.getElementById('name').textContent=title;document.getElementById('size').textContent=[s.x,s.y,s.z].map(x=>x.toFixed(1)).join(' × ')+' мм';renderer.render(scene,camera);
};
</script></body></html>
