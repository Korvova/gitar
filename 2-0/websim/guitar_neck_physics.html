<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Привод в грифе — физический расчёт</title>
<style>
  :root {
    --bg: #0e1017; --panel: rgba(22,25,34,0.88); --line: #2b3040;
    --ink: #e6e8ef; --dim: #6f7689; --accent: #e8b04b; --bad: #e05f52; --ok: #5fb08a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  canvas { display: block; }
  .panel { position: fixed; top: 16px; left: 16px; width: 250px; background: var(--panel);
    border: 1px solid var(--line); padding: 14px 14px 12px; backdrop-filter: blur(8px); max-height: calc(100vh - 32px); overflow-y: auto; }
  .panel h1 { margin: 0 0 12px; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
  .ctl { margin-bottom: 11px; }
  .ctl label { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 0.05em; margin-bottom: 5px; }
  .ctl label span:last-child { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 2px; background: var(--line); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: var(--accent); cursor: pointer; border-radius: 50%; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: none; background: var(--accent); cursor: pointer; border-radius: 50%; }
  button { width: 100%; margin-top: 6px; padding: 7px; background: transparent; border: 1px solid var(--line);
    color: var(--ink); font: inherit; font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.on { border-color: var(--bad); color: var(--bad); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hud { position: fixed; left: 16px; bottom: 16px; font-size: 11px; letter-spacing: 0.05em; line-height: 1.9; pointer-events: none; }
  .hud .row { display: flex; gap: 10px; }
  .hud .k { color: var(--dim); width: 156px; }
  .hud .v { color: var(--accent); font-variant-numeric: tabular-nums; }
  .hud .v.ok { color: var(--ok); } .hud .v.bad { color: var(--bad); }
  .hint { position: fixed; right: 16px; bottom: 16px; text-align: right; font-size: 10px;
    letter-spacing: 0.11em; color: var(--dim); text-transform: uppercase; line-height: 1.95; pointer-events: none; }
  .err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 40px; font-size: 13px; line-height: 1.7; color: var(--bad); }
  @media (max-width: 700px) { .hint { display: none; } .panel { width: 200px; } }
</style>
</head>
<body>

<div class="panel">
  <h1>Физический расчёт</h1>
  <div class="ctl">
    <label><span>Задание мотору</span><span id="v-rpm">40 об/мин</span></label>
    <input type="range" id="rpm" min="0" max="120" step="5" value="40">
  </div>
  <div class="ctl">
    <label><span>Момент мотора</span><span id="v-tq">50 мН·м</span></label>
    <input type="range" id="tq" min="0" max="120" step="2" value="50">
  </div>
  <div class="ctl">
    <label><span>Нагрузка тележки</span><span id="v-ld">0.5 Н</span></label>
    <input type="range" id="ld" min="0" max="6" step="0.1" value="0.5">
  </div>
  <button id="pause">Пауза</button>
  <button id="block">Поставить упор</button>
  <button id="grav">Гитара лежит</button>
  <button id="ghost">Скрыть дерево</button>
  <button id="top">Вид сверху</button>
  <button id="reset">Собрать заново</button>
</div>

<div class="hud">
  <div class="row"><span class="k">ОБОРОТЫ ФАКТ</span><span class="v" id="h-w">0</span></div>
  <div class="row"><span class="k">МОМЕНТ НА ВАЛУ</span><span class="v" id="h-t">0</span></div>
  <div class="row"><span class="k">ТЕЛЕЖКА ОТ ЦЕНТРА</span><span class="v" id="h-x">0</span></div>
  <div class="row"><span class="k">СОСТОЯНИЕ</span><span class="v ok" id="h-s">—</span></div>
</div>

<div class="hint">
  лкм — поворот<br>пкм / shift — сдвиг<br>wasd — сдвиг<br>колесо — приближение<br>r — сброс вида
</div>
<div class="err" id="err">Не удалось загрузить физический движок.<br>Проверьте доступ к cdnjs.cloudflare.com и перезагрузите страницу.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
if (typeof CANNON === 'undefined' || typeof THREE === 'undefined') {
  document.getElementById('err').style.display = 'flex';
  throw new Error('libs');
}

// ============================================================
//  ГЕОМЕТРИЯ. Физика считается в метрах, графика — в сантиметрах.
//  Плоскость механизма XY, ось вращения всех шарниров — Z.
// ============================================================
const S = 100;                 // м → см
const ARM_A = 0.015;           // короткое плечо рычага, поперёк грифа
const ARM_B = 0.050;           // длинное плечо, вдоль грифа
const PVX = 0, PVY = 0.335;    // ось качания
const MOX = 0.015, MOY = -0.040;
const ECC = 0.006;             // эксцентрик мотора
const SPOKE = Math.sqrt((MOX + ECC - ARM_A) ** 2 + (PVY - MOY) ** 2);
const R_PIN = 0.00125;         // палец Ø2.5 мм
const SLOT = 0.00145;          // полуширина паза — зазор 0.2 мм на сторону
const CART_Y = 0.3829;

// ============================================================
//  ГРАФИКА
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1017);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 400);
const TARGET = new THREE.Vector3(11, -0.5, 0);
const HOME = TARGET.clone();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const flat = new THREE.Group(); flat.rotation.x = -Math.PI / 2; scene.add(flat);
const root = new THREE.Group(); root.rotation.z = -Math.PI / 2; flat.add(root);

const M = {
  wood:  new THREE.MeshStandardMaterial({ color: 0x9a6b43, roughness: 0.85 }),
  board: new THREE.MeshStandardMaterial({ color: 0x2e2119, roughness: 0.8 }),
  body:  new THREE.MeshStandardMaterial({ color: 0x8d5f3c, roughness: 0.8, transparent: true, opacity: 0.3 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x8b95ab, metalness: 0.8, roughness: 0.28 }),
  motor: new THREE.MeshStandardMaterial({ color: 0x33384a, metalness: 0.6, roughness: 0.45 }),
  gold:  new THREE.MeshStandardMaterial({ color: 0xc9a44c, metalness: 0.85, roughness: 0.32 }),
  bell:  new THREE.MeshStandardMaterial({ color: 0x2f4a86, metalness: 0.45, roughness: 0.45 }),
  cart:  new THREE.MeshStandardMaterial({ color: 0x4f9a95, metalness: 0.45, roughness: 0.42 }),
  stop:  new THREE.MeshStandardMaterial({ color: 0xe05f52, roughness: 0.5 }),
  limit: new THREE.MeshStandardMaterial({ color: 0xe05f52, emissive: 0x5a1a14, roughness: 0.6 })
};

function cylZ(r, h, mat) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 26), mat);
  m.rotation.x = Math.PI / 2; m.castShadow = true; m.receiveShadow = true; return m;
}
function box(w, h, d, mat, x, y, z, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  (parent || root).add(m); return m;
}

// ---- гриф ----
box(5, 40, 0.4, M.board, 0, 20, -2.2);
box(5, 40, 0.7, M.wood, 0, 20, -1.65);
box(0.3, 37.6, 1.3, M.wood, -2.35, 18.8, -0.65);
box(0.3, 37.6, 1.3, M.wood,  2.35, 18.8, -0.65);
box(5, 1.05, 1.3, M.wood, 0, 39.42, -0.65);
box(5, 0.35, 0.5, M.wood, 0, 37.57, -0.25);
box(0.06, 40, 0.06, M.limit, -2.5, 20, 0.02);
box(0.06, 40, 0.06, M.limit,  2.5, 20, 0.02);
box(26, 22, 4.5, M.body, 0, -11, -1.6);

// ---- мотор ----
const motorCan = cylZ(0.9, 1.0, M.motor); motorCan.position.set(MOX * S, MOY * S, -1.9); root.add(motorCan);
const crankView = new THREE.Group(); crankView.position.set(MOX * S, MOY * S, 0); root.add(crankView);
const ecDisc = cylZ(0.85, 0.25, M.gold); ecDisc.position.z = -1.4; crankView.add(ecDisc);
const ecPin = cylZ(0.15, 0.45, M.steel); ecPin.position.set(ECC * S, 0, -1.05); crankView.add(ecPin);

// ---- спица ----
const spokeView = new THREE.Group(); root.add(spokeView);
{
  const b = new THREE.Mesh(new THREE.BoxGeometry(SPOKE * S, 0.16, 0.16), M.steel);
  b.castShadow = true; spokeView.add(b);
  [-1, 1].forEach(s => {
    const e = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.07, 12, 26), M.steel);
    e.position.x = s * SPOKE * S / 2; e.castShadow = true; spokeView.add(e);
  });
}

// ---- угловой рычаг ----
const pivotPin = cylZ(0.16, 0.9, M.steel); pivotPin.position.set(PVX * S, PVY * S, -0.95); root.add(pivotPin);
const bellView = new THREE.Group(); bellView.position.set(PVX * S, PVY * S, -0.7); root.add(bellView);
{
  const a = ARM_A * S, b = ARM_B * S;
  const shape = new THREE.Shape();
  shape.moveTo(0, 0); shape.lineTo(a, 0);
  shape.quadraticCurveTo(a * 0.45, b * 0.45, 0, b); shape.closePath();
  const plate = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.3, bevelEnabled: false }), M.bell);
  plate.position.z = -0.15; plate.castShadow = true; bellView.add(plate);
  const armA = new THREE.Mesh(new THREE.BoxGeometry(a, 0.34, 0.3), M.bell);
  armA.position.set(a / 2, 0, 0); armA.castShadow = true; bellView.add(armA);
  const armB = new THREE.Mesh(new THREE.BoxGeometry(0.34, b, 0.3), M.bell);
  armB.position.set(0, b / 2, 0); armB.castShadow = true; bellView.add(armB);
  bellView.add(cylZ(0.34, 0.32, M.bell));
  const bossA = cylZ(0.26, 0.32, M.bell); bossA.position.set(a, 0, 0); bellView.add(bossA);
  const bossB = cylZ(0.20, 0.32, M.bell); bossB.position.set(0, b, 0); bellView.add(bossB);
  const pinA = cylZ(0.13, 0.55, M.steel); pinA.position.set(a, 0, -0.35); bellView.add(pinA);
  const pinB = cylZ(R_PIN * S, 0.65, M.steel); pinB.position.set(0, b, 0.42); bellView.add(pinB);
}

// ---- тележка ----
const cartView = new THREE.Group(); cartView.position.set(0, CART_Y * S, -0.25); root.add(cartView);
[-1, 1].forEach(s => {
  const w = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.2, 0.4), M.cart);
  w.position.x = s * (SLOT * S + 0.075); w.castShadow = true; cartView.add(w);
});
[-1, 1].forEach(s => {
  const c = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.4), M.cart);
  c.position.y = s * 0.5; c.castShadow = true; cartView.add(c);
});

// ---- упор ----
const stopView = box(0.4, 1.6, 0.6, M.stop, 1.2, CART_Y * S, -0.25);
stopView.visible = false;

// ---- свет ----
scene.add(new THREE.AmbientLight(0x8a93ad, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.0);
key.position.set(14, 30, 12); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -26; key.shadow.camera.right = 26;
key.shadow.camera.top = 26; key.shadow.camera.bottom = -26;
scene.add(key);
const rim = new THREE.DirectionalLight(0xe8b04b, 0.35); rim.position.set(-14, 9, -11); scene.add(rim);

// ============================================================
//  ФИЗИКА
// ============================================================
const G_LINK = 1, G_PIN = 2, G_CART = 4, G_OBST = 8;

const world = new CANNON.World();
world.gravity.set(0, 0, 0);            // гитара лежит: вес деталей несёт дно канала
world.solver.iterations = 60;
world.solver.tolerance = 1e-8;
world.defaultContactMaterial.contactEquationStiffness = 2e6;
world.defaultContactMaterial.contactEquationRelaxation = 5;
world.defaultContactMaterial.friction = 0.06;
world.defaultContactMaterial.restitution = 0;

// В cannon 0.6.2 свойств linearFactor/angularFactor может не быть — ставим их
// только если они есть. Основную работу всё равно делают обратные массы.
function lockAxes(body, lin, ang) {
  if (body.linearFactor && body.linearFactor.set) body.linearFactor.set(lin[0], lin[1], lin[2]);
  if (body.angularFactor && body.angularFactor.set) body.angularFactor.set(ang[0], ang[1], ang[2]);
}

// Подшипник: нулевая обратная масса (сдвинуть нельзя) при конечном обратном
// моменте инерции вокруг своей оси. Решатель видит это честно и не копит энергию.
function bearing(body, Iz) {
  body.updateMassProperties();
  body.invMass = 0;
  body.inertia.set(0, 0, Iz);
  body.invInertia.set(0, 0, 1 / Iz);
  body.updateInertiaWorld(true);
  lockAxes(body, [0, 0, 0], [0, 0, 1]);
}
// Свободное тело, но повороты только в плоскости механизма
function planar(body, Iz) {
  body.updateMassProperties();
  body.inertia.set(0, 0, Iz);
  body.invInertia.set(0, 0, 1 / Iz);
  body.updateInertiaWorld(true);
  lockAxes(body, [1, 1, 1], [0, 0, 1]);
}

const M_CRANK = 0.040, M_SPOKE = 0.010, M_BELL = 0.020, M_CART = 0.030;

// --- кривошип мотора ---
const crank = new CANNON.Body({ mass: M_CRANK, position: new CANNON.Vec3(MOX, MOY, 0) });
crank.addShape(new CANNON.Box(new CANNON.Vec3(0.012, 0.012, 0.003)));
crank.collisionFilterGroup = G_LINK; crank.collisionFilterMask = 0;
crank.angularDamping = 0.02;
bearing(crank, 1.2e-5);
world.addBody(crank);

// --- спица ---
const spoke = new CANNON.Body({ mass: M_SPOKE });
spoke.addShape(new CANNON.Box(new CANNON.Vec3(SPOKE / 2, 0.0015, 0.0015)));
spoke.collisionFilterGroup = G_LINK; spoke.collisionFilterMask = 0;
spoke.linearDamping = 0.03; spoke.angularDamping = 0.03;
planar(spoke, M_SPOKE * SPOKE * SPOKE / 12);
world.addBody(spoke);

// --- угловой рычаг ---
const BELL_CM = new CANNON.Vec3(ARM_A / 3, ARM_B / 3, 0);
const bell = new CANNON.Body({ mass: M_BELL, position: new CANNON.Vec3(PVX, PVY, 0) });
bell.addShape(new CANNON.Sphere(R_PIN), new CANNON.Vec3(0, ARM_B, 0));
bell.collisionFilterGroup = G_PIN; bell.collisionFilterMask = G_CART;
bell.angularDamping = 0.03;
bearing(bell, 2.0e-5);
world.addBody(bell);

// --- тележка ---
const cart = new CANNON.Body({ mass: M_CART, position: new CANNON.Vec3(0, CART_Y, 0) });
cart.addShape(new CANNON.Box(new CANNON.Vec3(0.00075, 0.006, 0.002)), new CANNON.Vec3(-(SLOT + 0.00075), 0, 0));
cart.addShape(new CANNON.Box(new CANNON.Vec3(0.00075, 0.006, 0.002)), new CANNON.Vec3( (SLOT + 0.00075), 0, 0));
cart.fixedRotation = true;
cart.updateMassProperties();
lockAxes(cart, [1, 0, 0], [0, 0, 0]);
cart.collisionFilterGroup = G_CART; cart.collisionFilterMask = G_PIN | G_OBST;
cart.linearDamping = 0.08;
world.addBody(cart);

// направляющая тележки: после каждого шага возвращаем её строго на свою прямую
function lockCart() {
  cart.position.y = CART_Y; cart.position.z = 0;
  cart.velocity.y = 0; cart.velocity.z = 0;
  cart.quaternion.set(0, 0, 0, 1);
  cart.angularVelocity.setZero();
}

// --- шарниры спицы ---
// оба пальца лежат на её продольной оси, поэтому система имеет ровно одну
// степень свободы и решателю не приходится бороться с переопределением
const jointMotor = new CANNON.PointToPointConstraint(
  crank, new CANNON.Vec3(ECC, 0, 0), spoke, new CANNON.Vec3(-SPOKE / 2, 0, 0), 1e3);
const jointBell = new CANNON.PointToPointConstraint(
  bell, new CANNON.Vec3(ARM_A, 0, 0), spoke, new CANNON.Vec3(SPOKE / 2, 0, 0), 1e3);
world.addConstraint(jointMotor);
world.addConstraint(jointBell);

// --- ограничители хода в дереве и съёмный упор ---
function staticBox(hx, hy, x, y, group) {
  const b = new CANNON.Body({ mass: 0, position: new CANNON.Vec3(x, y, 0) });
  b.addShape(new CANNON.Box(new CANNON.Vec3(hx, hy, 0.004)));
  b.collisionFilterGroup = group; b.collisionFilterMask = G_CART;
  return b;
}
world.addBody(staticBox(0.002, 0.008, -0.0255, CART_Y, G_OBST));
world.addBody(staticBox(0.002, 0.008,  0.0255, CART_Y, G_OBST));
const obstacle = staticBox(0.002, 0.008, 0.012, CART_Y, G_OBST);
let obstacleOn = false;

// --- исходная сборка ---
function assemble() {
  crank.position.set(MOX, MOY, 0);
  crank.quaternion.set(0, 0, 0, 1);
  crank.velocity.setZero(); crank.angularVelocity.setZero();

  bell.position.set(PVX, PVY, 0);
  bell.quaternion.set(0, 0, 0, 1);
  bell.velocity.setZero(); bell.angularVelocity.setZero();

  const cx = MOX + ECC, cy = MOY;
  const ax = ARM_A, ay = PVY;
  spoke.position.set((cx + ax) / 2, (cy + ay) / 2, 0);
  const ang = Math.atan2(ay - cy, ax - cx);
  spoke.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 0, 1), ang);
  spoke.velocity.setZero(); spoke.angularVelocity.setZero();

  cart.position.set(0, CART_Y, 0);
  cart.velocity.setZero();
}
assemble();

// ============================================================
//  УПРАВЛЕНИЕ
// ============================================================
let targetRpm = 40, maxTorque = 0.050, load = 0.5, paused = false, ghost = false, standing = false;
const $ = id => document.getElementById(id);
$('rpm').oninput = e => { targetRpm = +e.target.value; $('v-rpm').textContent = targetRpm + ' об/мин'; };
$('tq').oninput  = e => { maxTorque = +e.target.value / 1000; $('v-tq').textContent = e.target.value + ' мН·м'; };
$('ld').oninput  = e => { load = +e.target.value; $('v-ld').textContent = (+e.target.value).toFixed(1) + ' Н'; };
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Продолжить' : 'Пауза'; };
$('reset').onclick = assemble;
$('block').onclick = () => {
  obstacleOn = !obstacleOn;
  if (obstacleOn) world.addBody(obstacle); else world.removeBody(obstacle);
  stopView.visible = obstacleOn;
  $('block').textContent = obstacleOn ? 'Убрать упор' : 'Поставить упор';
  $('block').className = obstacleOn ? 'on' : '';
};
$('grav').onclick = () => {
  standing = !standing;
  world.gravity.set(0, standing ? -9.81 : 0, 0);
  $('grav').textContent = standing ? 'Гитара стоит' : 'Гитара лежит';
};
$('ghost').onclick = () => {
  ghost = !ghost;
  $('ghost').textContent = ghost ? 'Показать дерево' : 'Скрыть дерево';
  [M.wood, M.board].forEach(m => { m.transparent = ghost; m.opacity = ghost ? 0.18 : 1; m.needsUpdate = true; });
};
$('top').onclick = () => { camTheta = 0; camPhi = 0.06; camDist = 34; TARGET.copy(HOME); };

// ---- камера ----
let camTheta = 0.0, camPhi = 0.45, camDist = 42;
let dragging = 0, px = 0, py = 0;
const el = renderer.domElement;
el.style.cursor = 'grab';
el.addEventListener('contextmenu', ev => ev.preventDefault());
const vRight = new THREE.Vector3(), vFwd = new THREE.Vector3(), vUp = new THREE.Vector3();
function screenAxes() {
  vRight.set(Math.cos(camTheta), 0, -Math.sin(camTheta));
  vFwd.subVectors(TARGET, camera.position).normalize();
  vUp.crossVectors(vRight, vFwd).normalize();
}
function pan(dx, dy) {
  screenAxes();
  const k = camDist * 0.0016;
  TARGET.addScaledVector(vRight, -dx * k);
  TARGET.addScaledVector(vUp, dy * k);
}
function down(x, y, mode) { dragging = mode; px = x; py = y; el.style.cursor = mode === 2 ? 'move' : 'grabbing'; }
function move(x, y) {
  if (!dragging) return;
  const dx = x - px, dy = y - py; px = x; py = y;
  if (dragging === 2) { pan(dx, dy); return; }
  camTheta -= dx * 0.006;
  camPhi = Math.max(0.04, Math.min(1.56, camPhi - dy * 0.005));
}
function up() { dragging = 0; el.style.cursor = 'grab'; }
el.addEventListener('mousedown', ev => down(ev.clientX, ev.clientY, (ev.button === 2 || ev.button === 1 || ev.shiftKey) ? 2 : 1));
addEventListener('mousemove', ev => move(ev.clientX, ev.clientY));
addEventListener('mouseup', up);
let pinch = 0;
el.addEventListener('touchstart', ev => {
  if (ev.touches.length === 2) {
    dragging = 2;
    px = (ev.touches[0].clientX + ev.touches[1].clientX) / 2;
    py = (ev.touches[0].clientY + ev.touches[1].clientY) / 2;
    pinch = Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX, ev.touches[0].clientY - ev.touches[1].clientY);
  } else down(ev.touches[0].clientX, ev.touches[0].clientY, 1);
}, { passive: true });
el.addEventListener('touchmove', ev => {
  ev.preventDefault();
  if (ev.touches.length === 2) {
    const cx = (ev.touches[0].clientX + ev.touches[1].clientX) / 2;
    const cy = (ev.touches[0].clientY + ev.touches[1].clientY) / 2;
    const d = Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX, ev.touches[0].clientY - ev.touches[1].clientY);
    pan(cx - px, cy - py);
    camDist = Math.min(90, Math.max(12, camDist * (pinch / Math.max(1, d))));
    px = cx; py = cy; pinch = d;
  } else move(ev.touches[0].clientX, ev.touches[0].clientY);
}, { passive: false });
addEventListener('touchend', up);
el.addEventListener('wheel', ev => {
  ev.preventDefault();
  camDist = Math.min(90, Math.max(12, camDist + ev.deltaY * 0.03));
}, { passive: false });
const keys = {};
addEventListener('keydown', ev => {
  keys[ev.key.toLowerCase()] = true;
  if (ev.key.toLowerCase() === 'r') { camTheta = 0; camPhi = 0.45; camDist = 42; TARGET.copy(HOME); }
});
addEventListener('keyup', ev => { keys[ev.key.toLowerCase()] = false; });
function keyboardPan(dt) {
  let dx = 0, dy = 0;
  if (keys['a'] || keys['arrowleft'])  dx += 1;
  if (keys['d'] || keys['arrowright']) dx -= 1;
  if (keys['w'] || keys['arrowup'])    dy -= 1;
  if (keys['s'] || keys['arrowdown'])  dy += 1;
  if (dx || dy) pan(dx * dt * 900, dy * dt * 900);
  if (keys['q']) TARGET.y -= camDist * 0.6 * dt;
  if (keys['e']) TARGET.y += camDist * 0.6 * dt;
}

// ============================================================
//  ЦИКЛ
// ============================================================
const FIXED = 1 / 480;
const clock = new THREE.Clock();
let tqApplied = 0, stallTimer = 0, accum = 0;

// Силы прикладываем сами перед каждым фиксированным шагом: cannon обнуляет их
// после шага, а на события движка в этой версии полагаться нельзя.
function applyForces() {
  const wTarget = targetRpm / 60 * 2 * Math.PI;
  const w = crank.angularVelocity.z;
  let tau = (wTarget - w) * maxTorque * 8;
  tau = Math.max(-maxTorque, Math.min(maxTorque, tau));
  tqApplied = tau;
  crank.torque.z += tau;

  // сопротивление тележки: сухое трение, сглаженное у нуля
  cart.force.x += -load * Math.tanh(cart.velocity.x / 0.004);

  // в вертикальном положении вес рычага даёт момент на своей оси
  if (standing) {
    const r = bell.quaternion.vmult(BELL_CM);
    bell.torque.z += r.x * (-9.81 * M_BELL);
  }
}

function sane() {
  return Number.isFinite(crank.angularVelocity.z) && Number.isFinite(spoke.position.x)
      && Number.isFinite(cart.position.x)
      && Math.abs(bell.angularVelocity.z) < 300 && Math.abs(spoke.position.y) < 2;
}

function physics(dt) {
  accum += dt;
  let n = 0;
  try {
    while (accum >= FIXED && n < 10) {
      applyForces();
      world.step(FIXED);        // строго один внутренний шаг
      lockCart();
      accum -= FIXED; n++;
    }
  } catch (e) {
    console.warn('шаг физики сорвался, пересобираю:', e);
    assemble(); accum = 0; return;
  }
  if (n >= 10) accum = 0;     // не догоняем, если кадр провис
  if (!sane()) { assemble(); accum = 0; }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  keyboardPan(dt);
  if (!paused) physics(dt);

  crankView.quaternion.set(crank.quaternion.x, crank.quaternion.y, crank.quaternion.z, crank.quaternion.w);
  bellView.quaternion.set(bell.quaternion.x, bell.quaternion.y, bell.quaternion.z, bell.quaternion.w);
  spokeView.position.set(spoke.position.x * S, spoke.position.y * S, -1.05);
  spokeView.quaternion.set(spoke.quaternion.x, spoke.quaternion.y, spoke.quaternion.z, spoke.quaternion.w);
  cartView.position.x = cart.position.x * S;

  const rpmNow = crank.angularVelocity.z * 60 / (2 * Math.PI);
  $('h-w').textContent = rpmNow.toFixed(1) + ' об/мин';
  $('h-t').textContent = (tqApplied * 1000).toFixed(1) + ' мН·м';
  $('h-x').textContent = (cart.position.x * 1000).toFixed(1) + ' мм';

  const st = $('h-s');
  const wanted = targetRpm > 0;
  if (wanted && Math.abs(rpmNow) < 2) stallTimer += dt; else stallTimer = 0;
  if (!wanted) { st.textContent = 'стоит'; st.className = 'v'; }
  else if (stallTimer > 0.4) { st.textContent = 'не хватает момента'; st.className = 'v bad'; }
  else if (Math.abs(rpmNow) < targetRpm * 0.7) { st.textContent = 'тянет с натугой'; st.className = 'v bad'; }
  else { st.textContent = 'крутится'; st.className = 'v ok'; }

  camera.position.set(
    TARGET.x + camDist * Math.sin(camPhi) * Math.sin(camTheta),
    TARGET.y + camDist * Math.cos(camPhi),
    TARGET.z + camDist * Math.sin(camPhi) * Math.cos(camTheta)
  );
  screenAxes();
  camera.up.copy(vUp);
  camera.lookAt(TARGET);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
