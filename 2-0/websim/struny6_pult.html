<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Шестиструнка: осциллографы + звук</title>
<style>
  body{background:#14161a;color:#e8e8ea;font-family:"Segoe UI",system-ui,sans-serif;
       margin:0;padding:16px}
  h1{font-size:1.2em;margin:0 0 10px}
  button{background:#ff7a1a;color:#14161a;border:0;border-radius:8px;
         padding:10px 18px;font-size:1em;font-weight:700;cursor:pointer;margin-right:8px}
  button.sec{background:#2a2f38;color:#e8e8ea}
  .row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:8px 0}
  .box{background:#1d2026;border-radius:10px;padding:8px 12px}
  .val{font-weight:700;color:#7fb0ff}
  input[type=range]{width:160px;vertical-align:middle}
  select{background:#2a2f38;color:#e8e8ea;border:0;border-radius:6px;padding:4px 6px}
  .dim{color:#9aa0aa;font-size:.9em}
  .str{display:flex;gap:10px;align-items:center;margin:6px 0}
  .str .lbl{width:74px;font-weight:700}
  .str canvas{flex:1;height:72px;background:#0b0d10;border-radius:8px;
              border:1px solid #2a2f38;display:block;min-width:200px}
  .str .raw{width:56px;text-align:right;font-variant-numeric:tabular-nums}
  .str.dead .lbl{color:#e03535}
  .led{width:14px;height:14px;border-radius:50%;background:#2a2f38;
       transition:background .05s}
</style>
</head>
<body>
<h1>🎸 Шестиструнка — 6 × AS5600 через TCA9548A</h1>
<div class="row">
  <button id="btnConnect">Подключить COM</button>
  <button id="btnZero" class="sec">Ноль</button>
  <button id="btnSound" class="sec">🔊 Звук: вкл</button>
  <label>Порог щипка <input type="range" id="thr" min="10" max="600" value="80">
    <span id="thrV" class="dim">80</span></label>
  <label>Громкость <input type="range" id="vol" min="0" max="100" value="60"></label>
  <label>Окно (сек) <input type="range" id="win" min="1" max="10" value="3"></label>
  <span class="dim" id="status">не подключено</span>
</div>
<div id="strings"></div>
<p class="dim">Прошивка: <code>struny6_test/struny6_test.ino</code> (460800, ~650 строк/с
«v0 … v5», −1 = датчика нет на канале). Канал 0 = струна 1 … канал 5 = струна 6.
«Ноль» — нажать при струнах в покое. Нота каждой струны — селектором слева.</p>

<script>
const N = 6, SR = 650;                 // струн, выборок/с с прошивки
// Дефолт: струна 1 = высокая E (стандартный строй сверху вниз)
const NOTES = [['E4',329.6],['B3',246.9],['G3',196.0],['D3',146.8],
               ['A2',110.0],['E2',82.4]];
const ALL_NOTES = [['E2',82.4],['A2',110.0],['D3',146.8],['G3',196.0],
                   ['B3',246.9],['E4',329.6]];

// ---------- разметка 6 строк ----------
const S = [];                          // состояние струн
const host = document.getElementById('strings');
for (let i = 0; i < N; i++) {
  const div = document.createElement('div');
  div.className = 'str';
  div.innerHTML =
    `<span class="led" id="led${i}"></span>
     <span class="lbl">Струна ${i + 1}</span>
     <select id="note${i}">` +
    ALL_NOTES.map(n => `<option value="${n[1]}"` +
      (n[1] === NOTES[i][1] ? ' selected' : '') + `>${n[0]}</option>`).join('') +
    `</select>
     <canvas id="cv${i}"></canvas>
     <span class="raw val" id="raw${i}">—</span>`;
  host.appendChild(div);
  S.push({buf: [], zero: null, fastZero: null, raw: 0, armed: true,
          lastPluck: 0, dead: false, buffers: {},
          cv: div.querySelector('canvas'), div});
}

// ---------- Web Serial ----------
let port, reader, sound = true, rxCount = 0;
async function connect() {
  const st = document.getElementById('status');
  try {
    port = await navigator.serial.requestPort();
    await port.open({baudRate: 460800});
    try {   // ESP32: не держать плату в ресете сигналами DTR/RTS
      await port.setSignals({dataTerminalReady: false, requestToSend: false});
    } catch (e) {}
    st.textContent = 'подключено, жду данные…';
    st.style.color = '#2fb344';
    readLoop();
  } catch (e) {
    st.textContent = 'ОШИБКА: ' + e.message +
      ' (закрой другие вкладки/IDE — порт занят!)';
    st.style.color = '#e03535';
  }
}
setInterval(() => {
  if (rxCount > 0) {
    const st = document.getElementById('status');
    st.textContent = 'поток: ' + rxCount + ' строк/с';
    st.style.color = '#2fb344';
  }
  rxCount = 0;
}, 1000);
async function readLoop() {
  const dec = new TextDecoder();
  let carry = '';
  reader = port.readable.getReader();
  while (true) {
    const {value, done} = await reader.read();
    if (done) break;
    const lines = (carry + dec.decode(value)).split('\n');
    carry = lines.pop();
    for (const ln of lines) {
      if (ln[0] === '#') continue;     // стартовый отчёт прошивки
      const parts = ln.trim().split(/\s+/);
      if (parts.length !== N) continue;
      rxCount++;
      for (let i = 0; i < N; i++) pushSample(i, parseInt(parts[i]));
    }
  }
}

// ---------- данные ----------
function pushSample(i, v) {
  const s = S[i];
  if (isNaN(v)) return;
  if (v < 0) {                         // -1 = датчика нет
    if (!s.dead) { s.dead = true; s.div.classList.add('dead'); }
    return;
  }
  if (s.dead) { s.dead = false; s.div.classList.remove('dead'); }
  s.raw = v;
  if (s.zero === null) { s.zero = v; s.fastZero = v; }
  s.zero += (v - s.zero) / 1000;       // ноль графика (тау ~1.5 с)
  s.fastZero += (v - s.fastZero) / 40; // быстрый ноль детекта (тау ~60 мс)
  const d = v - s.zero;
  const hp = v - s.fastZero;           // видит только БЫСТРОЕ движение
  s.buf.push(d);
  const maxLen = SR * 12;
  if (s.buf.length > maxLen) s.buf.splice(0, s.buf.length - maxLen);
  detectPluck(i, hp);
}

// ---------- детект щипка + звук (Карплус-Стронг) ----------
let audioCtx = null;
function makePluck(f0) {               // сэмпл щипка ~1.2 c
  const sr = audioCtx.sampleRate;
  const M = Math.round(sr / f0), len = Math.round(sr * 1.2);
  const data = new Float32Array(len), d = new Float32Array(M);
  for (let i = 0; i < M; i++) d[i] = Math.random() * 2 - 1;
  let idx = 0;
  for (let i = 0; i < len; i++) {
    const nxt = (idx + 1) % M;
    d[idx] = (d[idx] + d[nxt]) * 0.498;              // затухание
    data[i] = d[idx];
    idx = nxt;
  }
  const b = audioCtx.createBuffer(1, len, sr);
  b.copyToChannel(data, 0);
  return b;
}
function playPluck(i, strength) {
  if (!sound) return;
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const f0 = +document.getElementById('note' + i).value;
  const s = S[i];
  if (!s.buffers[f0]) s.buffers[f0] = makePluck(f0);
  const src = audioCtx.createBufferSource();
  src.buffer = s.buffers[f0];
  const g = audioCtx.createGain();
  const vol = document.getElementById('vol').value / 100;
  g.gain.value = Math.min(1, strength) * vol;
  src.connect(g).connect(audioCtx.destination);
  src.start();
  const led = document.getElementById('led' + i);
  led.style.background = '#2fb344';
  setTimeout(() => led.style.background = '#2a2f38', 120);
}
function detectPluck(i, d) {
  const s = S[i];
  const thr = +document.getElementById('thr').value;
  const a = Math.abs(d);
  const now = performance.now();
  if (s.armed && a > thr && now - s.lastPluck > 70) { // фронт + антидребезг
    s.armed = false;
    s.lastPluck = now;
    playPluck(i, a / (thr * 4));
  } else if (!s.armed && a < thr * 0.85) {
    s.armed = true;                    // быстрый перевзвод чуть ниже порога
  }
}

// ---------- осциллографы ----------
function draw() {
  requestAnimationFrame(draw);
  const winSec = +document.getElementById('win').value;
  const thr = +document.getElementById('thr').value;
  for (let i = 0; i < N; i++) {
    const s = S[i], cv = s.cv, ctx = cv.getContext('2d');
    const W = cv.width = cv.clientWidth, H = cv.height = cv.clientHeight;
    ctx.fillStyle = '#0b0d10'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#2a2f38';
    ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
    document.getElementById('raw' + i).textContent = s.dead ? 'нет' : s.raw;
    const n = Math.min(s.buf.length, SR * winSec);
    if (n < 2) continue;
    const start = s.buf.length - n;
    let maxA = Math.max(60, thr * 1.2);
    for (let j = start; j < s.buf.length; j++)
      maxA = Math.max(maxA, Math.abs(s.buf[j]));
    // порог
    ctx.strokeStyle = '#e0353555'; ctx.setLineDash([4, 4]);
    for (const sg of [1, -1]) {
      const y = H / 2 - sg * (thr / maxA) * (H / 2 - 4);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.strokeStyle = '#7fb0ff'; ctx.lineWidth = 1.5; ctx.beginPath();
    for (let j = 0; j < n; j++) {
      const x = j / n * W;
      const y = H / 2 - (s.buf[start + j] / maxA) * (H / 2 - 4);
      j ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
  document.getElementById('thrV').textContent = thr;
}
draw();

// ---------- кнопки ----------
document.getElementById('btnConnect').onclick = connect;
document.getElementById('btnZero').onclick = () =>
  S.forEach(s => { s.zero = null; s.buf = []; });
document.getElementById('btnSound').onclick = (e) => {
  sound = !sound;
  e.target.textContent = sound ? '🔊 Звук: вкл' : '🔇 Звук: выкл';
};
</script>
</body>
</html>
