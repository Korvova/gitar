<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Струны 49E</title>
<style>
  body { font-family: system-ui, sans-serif; background:#f4f1ea; color:#1d1d1f; margin:0; padding:16px; }
  .wrap { max-width:640px; margin:0 auto; }
  .card { background:#fff; border-radius:12px; padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.12); }
  h1 { font-size:20px; margin:0 0 10px; }
  button { font-size:16px; padding:10px 16px; border-radius:8px; border:1px solid #bbb; background:#fff; cursor:pointer; margin:4px 6px 4px 0; }
  button.go { background:#2f6fd6; border-color:#2f6fd6; color:#fff; font-size:20px; padding:14px 24px; }
  button:disabled { opacity:.45; cursor:default; }
  #big { font-size:72px; font-weight:700; line-height:1.1; }
  #step { font-size:26px; font-weight:700; margin:6px 0 10px; }
  #live { font-size:22px; color:#555; }
  .mut { color:#6b6b6b; font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:16px; }
  td, th { padding:5px 4px; border-bottom:1px solid #eee; text-align:left; }
  tr.now td { background:#dfeaff; font-weight:700; }
  .bad { color:#c0392b; font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Струны по датчику 49E (рукой, мотор выключен)</h1>
    <button id="bConn">Подключить COM7</button>
    <span id="st" class="mut">не подключено</span>
    <div id="live">—</div>
  </div>

  <div class="card">
    <h1>Волна: ведите тележку слева направо</h1>
    <canvas id="wave" width="900" height="320" style="width:100%;background:#fff;border:1px solid #ddd"></canvas>
    <button id="bPause">Пауза</button>
    <button id="bClear">Очистить</button>
    <span id="waveInfo" class="mut"></span>
  </div>

  <div class="card" id="wiz">
    <div id="step">Сначала подключите плату</div>
    <button id="bRec" class="go" disabled>Записать</button>
    <button id="bBack" disabled>Назад</button>
    <button id="bAgain">Записать заново</button>
    <div class="mut">Поставьте тележку на струну, отпустите, нажмите «Записать». Точность не важна: запись нужна только для знака каждого магнита.</div>
  </div>

  <div class="card">
    <div class="mut">Сейчас</div>
    <div id="big">—</div>
    <div id="hint" class="mut"></div>
    <div style="margin-top:8px" class="mut">Порог пика, единиц: <input id="tol" type="number" value="60" style="width:70px;font-size:15px">
      <span id="tolHint"></span></div>
  </div>

  <div class="card">
    <table id="tab"></table>
    <div id="warn" class="mut" style="margin-top:8px"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let cal = [null, null, null, null, null, null], step = 0, recording = null;
let cur = null, cand = null, candN = 0, smooth = [], lastH = null, stillV = [];
const KEY = 'struny49e';
try { const v = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(v) && v.length === 6) { cal = v; } } catch (e) {}
step = cal.findIndex(v => v === null); if (step < 0) step = 6;

function save() { try { localStorage.setItem(KEY, JSON.stringify(cal)); } catch (e) {} }
function ready() { return cal.every(v => v !== null); }
function autoTol() { return ready() ? model().T : null; }
function render() {
  $('step').textContent = step < 6 ? 'Поставьте на струну ' + (step + 1) : 'Готово: все струны записаны';
  $('bRec').textContent = step < 6 ? 'Записать струну ' + (step + 1) : 'Записать';
  $('bRec').disabled = step >= 6 || !connected || recording !== null;
  $('bBack').disabled = step === 0 || recording !== null;
  let rows = '<tr><th>Струна</th><th>Значение</th><th>От соседней</th></tr>';
  for (let i = 0; i < 6; i++) {
    const d = i && cal[i] !== null && cal[i - 1] !== null ? Math.abs(cal[i] - cal[i - 1]) : '';
    rows += '<tr class="' + (cur === i ? 'now' : '') + '"><td>' + (i + 1) + '</td><td>' + (cal[i] === null ? '—' : cal[i]) + '</td><td>' + d + '</td></tr>';
  }
  $('tab').innerHTML = rows;
  const t = autoTol();
  $('tolHint').textContent = t ? '(советую ' + t + ')' : '';
  let close = [];
  if (ready()) for (let i = 1; i < 6; i++) if (Math.abs(cal[i] - cal[i - 1]) < 40) close.push((i) + ' и ' + (i + 1));
  $('warn').innerHTML = close.length ? '<span class="bad">Слишком похожи соседние струны: ' + close.join(', ') + '. Их не различить.</span>' : (ready() ? 'Соседние струны различаются.' : '');
}
$('bRec').onclick = () => {
  if (step >= 6) return;
  recording = { i: step, v: [] };
  $('bRec').textContent = 'Записываю…';
  render(); $('bRec').textContent = 'Записываю…';
};
$('bBack').onclick = () => { if (step > 0) { step--; cal[step] = null; save(); cur = null; render(); } };
$('bAgain').onclick = () => { cal = [null, null, null, null, null, null]; step = 0; cur = null; cand = null; save(); pk = 0; dir = 0; zeroN = 0; $('big').textContent = '—'; $('hint').textContent = ''; render(); };

// последовательность: струна меняется только на соседнюю, по знаку пика, размеру пика и направлению движения.
// Абсолютное число не сравниваем: оно плавает от точного положения, а знак и порядок — нет.
let pk = 0, pkMax = 0, dir = 0, zeroN = 0;
function model() {
  const v = cal.slice().sort((a, b) => a - b), med = (v[2] + v[3]) / 2;
  let n0 = 0;
  cal.forEach((x, i) => { if (Math.abs(x - med) < Math.abs(cal[n0] - med)) n0 = i; });
  const base = cal[n0], dev = cal.map(x => x - base);
  const mags = dev.map(Math.abs).filter(x => x > 0).sort((a, b) => a - b);
  return { n0, base, dev, T: Math.max(60, Math.round(mags[0] * 0.5)) };
}
function setCur(i) { cur = i; $('big').textContent = 'Струна ' + (cur + 1); render(); }
function detect(h) {
  smooth.push(h); if (smooth.length > 6) smooth.shift();
  if (!ready()) return;
  const v = smooth.reduce((a, b) => a + b, 0) / smooth.length;
  const m = model(), d = v - m.base, a = Math.abs(d), T = +$('tol').value || m.T;
  if (cur === null) {                                // старт: только со струны без магнита, там число надёжно
    $('hint').textContent = 'поставьте на струну ' + (m.n0 + 1) + ' (без магнита), чтобы начать счёт';
    if (a < T && ++zeroN > 100) { zeroN = 0; dir = 0; setCur(m.n0); $('hint').textContent = ''; }
    else if (a >= T) zeroN = 0;
    return;
  }
  if (a > T) {
    zeroN = 0;
    const sg = d > 0 ? 1 : -1;
    if (pk !== sg) {                                 // вошли в новый пик: выбираем из текущей и двух соседних
      pk = sg; pkMax = a;
      let best = -1, bs = 1e9;
      for (const i of [cur - 1, cur, cur + 1]) {
        if (i < 0 || i > 5 || i === m.n0) continue;
        if (Math.sign(m.dev[i]) !== sg) continue;
        let sc = 1;
        const st = i - cur;
        if (st && dir && st === dir) sc = 0.5;       // дальше в ту же сторону вероятнее
        if (!st) sc = 0.8;
        if (sc < bs) { bs = sc; best = i; }
      }
      if (best >= 0 && best !== cur) { dir = best - cur; setCur(best); }
      else if (best === cur) dir = -dir;
      $('hint').textContent = '';
    }
    pkMax = Math.max(pkMax, a);
    return;
  }
  if (a < T * 0.6) {
    pk = 0;
    if (Math.abs(cur - m.n0) === 1 && ++zeroN > 140) { dir = m.n0 - cur; setCur(m.n0); zeroN = 0; }   // долго нет поля рядом со струной без магнита
  }
}

// волна: последние 12 секунд
const WN = 2400;
let wave = [], wavePaused = false, waveTick = 0;
const cvW = $('wave'), cxW = cvW.getContext('2d');
function drawWave() {
  const W = cvW.width, H = cvW.height;
  cxW.clearRect(0, 0, W, H);
  if (wave.length < 2) return;
  let lo = Math.min(...wave), hi = Math.max(...wave);
  if (hi - lo < 200) { const c = (hi + lo) / 2; lo = c - 100; hi = c + 100; }
  const Y = v => H - 20 - (v - lo) / (hi - lo) * (H - 40);
  cxW.font = '14px sans-serif'; cxW.fillStyle = '#888'; cxW.strokeStyle = '#eee';
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4;
    cxW.beginPath(); cxW.moveTo(0, Y(v)); cxW.lineTo(W, Y(v)); cxW.stroke();
    cxW.fillText(Math.round(v), 4, Y(v) - 3);
  }
  if (ready()) {
    const b = model().base;
    if (b >= lo && b <= hi) { cxW.strokeStyle = '#c0392b'; cxW.beginPath(); cxW.moveTo(0, Y(b)); cxW.lineTo(W, Y(b)); cxW.stroke(); }
  }
  cxW.strokeStyle = '#2f6fd6'; cxW.lineWidth = 2; cxW.beginPath();
  wave.forEach((v, i) => { const x = i / (WN - 1) * W; i ? cxW.lineTo(x, Y(v)) : cxW.moveTo(x, Y(v)); });
  cxW.stroke(); cxW.lineWidth = 1;
  $('waveInfo').textContent = 'мин ' + Math.min(...wave) + ', макс ' + Math.max(...wave);
}
$('bPause').onclick = () => { wavePaused = !wavePaused; $('bPause').textContent = wavePaused ? 'Дальше' : 'Пауза'; };
$('bClear').onclick = () => { wave = []; drawWave(); };

let port = null, connected = false;
function onLine(l) {
  const m = l.match(/ h (\d+)/);
  if (!m) return;
  const h = +m[1]; lastH = h;
  $('live').textContent = 'датчик: ' + h;
  if (!wavePaused) { wave.push(h); if (wave.length > WN) wave.shift(); if (++waveTick % 20 === 0) drawWave(); }
  if (recording) {
    recording.v.push(h);
    if (recording.v.length >= 200) {
      const r = recording; recording = null;
      cal[r.i] = Math.round(r.v.reduce((a, b) => a + b, 0) / r.v.length);
      save(); step = r.i + 1; render();
      if (step >= 6) { const t = autoTol(); if (t) $('tol').value = t; cur = null; render(); }
    }
    return;
  }
  detect(h);
}
$('bConn').onclick = async () => {
  if (!('serial' in navigator)) { alert('Нужен Chrome или Edge'); return; }
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    connected = true; $('st').textContent = 'подключено'; render();
    const reader = port.readable.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value);
      let i;
      while ((i = buf.indexOf('\n')) >= 0) { onLine(buf.slice(0, i).trim()); buf = buf.slice(i + 1); }
    }
  } catch (e) { $('st').textContent = 'ошибка: ' + e.message; }
  connected = false; render();
};
render();
if (ready()) { const t = autoTol(); if (t) $('tol').value = t; }
</script>
</body>
</html>
